name: Validate Universal Markdown Exporter

on:
  push:
    paths:
      - 'userscript/**.js'
      - '.github/workflows/apply-ume-pr-bundle.yml'
  pull_request:
    paths:
      - 'userscript/**.js'
      - '.github/workflows/apply-ume-pr-bundle.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check userscript syntax
        run: node --check userscript/Universal_Markdown_Exporter.user.js
